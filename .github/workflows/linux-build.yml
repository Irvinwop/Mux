name: Linux WPE build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-eval:
    name: Nix flake evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check all flake outputs without building
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work:ro"
          --workdir /work
          nixos/nix:2.28.7
          nix --extra-experimental-features "nix-command flakes"
          flake check --no-build --all-systems path:/work

  wpe:
    name: Arch Linux / WPEPlatform
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          pacman -Syu --needed --noconfirm
          base-devel
          git
          glib2
          kitty
          meson
          ninja
          pkgconf
          wpewebkit

      - name: Check dependency surface
        run: ./doctor

      - name: Configure real WPE implementation
        run: meson setup --buildtype=release --werror build/ci spikes/wpe-kitty

      - name: Compile all WPE targets
        run: meson compile -C build/ci

      - name: Run native tests
        env:
          G_DEBUG: fatal-warnings
        run: meson test -C build/ci --print-errorlogs --no-rebuild
