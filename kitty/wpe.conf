# Real WPE page panes. Mux panes publish titles beginning with "MUX ", which
# lets these bindings leave ordinary terminal windows on Kitty's defaults.
include kitty.conf

# The launcher places the control socket in an owner-only runtime directory.
# The blank password permits exactly the three actions used by Mux itself.
allow_remote_control password
remote_control_password "" detach-window focus-window launch

# mux-pane is the trusted clipboard broker for this dedicated browser window.
clipboard_control write-clipboard read-clipboard

# Empty actions intentionally unmap Kitty handling and pass the keys to
# mux-pane. Super is canonical; Ctrl is an explicit Linux compatibility alias.
map --when-focus-on title:^MUX super+l
map --when-focus-on title:^MUX ctrl+l
map --when-focus-on title:^MUX super+r
map --when-focus-on title:^MUX ctrl+r
map --when-focus-on title:^MUX super+q
map --when-focus-on title:^MUX ctrl+q
map --when-focus-on title:^MUX super+w
map --when-focus-on title:^MUX ctrl+w
map --when-focus-on title:^MUX super+a
map --when-focus-on title:^MUX ctrl+a
map --when-focus-on title:^MUX super+c
map --when-focus-on title:^MUX ctrl+c
map --when-focus-on title:^MUX super+v
map --when-focus-on title:^MUX ctrl+v
map --when-focus-on title:^MUX super+x
map --when-focus-on title:^MUX ctrl+x
map --when-focus-on title:^MUX super+z
map --when-focus-on title:^MUX ctrl+z
map --when-focus-on title:^MUX super+shift+z
map --when-focus-on title:^MUX ctrl+shift+z
map --when-focus-on title:^MUX super+f
map --when-focus-on title:^MUX ctrl+f
map --when-focus-on title:^MUX super+d
map --when-focus-on title:^MUX ctrl+d
map --when-focus-on title:^MUX super+shift+p
map --when-focus-on title:^MUX ctrl+shift+p
map --when-focus-on title:^MUX super+shift+v
map --when-focus-on title:^MUX ctrl+shift+v

# Panes: create one or move focus with the Vim direction keys.
map --when-focus-on title:^MUX super+shift+enter launch --copy-env --location=vsplit mux-pane
map --when-focus-on title:^MUX ctrl+shift+enter launch --copy-env --location=vsplit mux-pane
map --when-focus-on title:^MUX super+alt+enter launch --copy-env --location=hsplit mux-pane
map --when-focus-on title:^MUX ctrl+alt+enter launch --copy-env --location=hsplit mux-pane
map --when-focus-on title:^MUX alt+h neighboring_window left
map --when-focus-on title:^MUX alt+j neighboring_window down
map --when-focus-on title:^MUX alt+k neighboring_window up
map --when-focus-on title:^MUX alt+l neighboring_window right

# Layers are Kitty tabs inside one dedicated Mux OS window.
map --when-focus-on title:^MUX super+shift+t launch --type=tab --copy-env mux-layer --new
map --when-focus-on title:^MUX ctrl+shift+t launch --type=tab --copy-env mux-layer --new
map --when-focus-on title:^MUX alt+[ previous_tab
map --when-focus-on title:^MUX alt+] next_tab
