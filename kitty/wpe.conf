# Real WPE page panes. The base file still owns visual defaults and the
# synthetic transport shortcuts remain available through kitty.conf.
include kitty.conf

allow_remote_control socket-only

map ctrl+shift+enter launch --copy-env --location=vsplit mux-pane
map ctrl+shift+t launch --type=tab --copy-env mux-layer --new
map ctrl+shift+n launch --type=os-window --copy-env mux-layer --new
