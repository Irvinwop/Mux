# Configuration for the dedicated Mux Kitty instance.
# It neither includes nor modifies the user's normal Kitty configuration.

term xterm-kitty
font_family monospace
font_size 12.0

background #07110f
foreground #d8e4dc
cursor #ffcb66
cursor_text_color #07110f
selection_background #244c42
selection_foreground #f3fbf6

active_border_color #4cd7a5
inactive_border_color #18322c
bell_border_color #ff6b5f
window_border_width 1px
draw_minimal_borders yes
window_padding_width 0

enabled_layouts splits
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background #4cd7a5
active_tab_foreground #07110f
inactive_tab_background #132923
inactive_tab_foreground #9ab3a8
tab_title_template " Mux {index} "
active_tab_title_template " Mux {index}: {title} "

enable_audio_bell no
visual_bell_duration 0.0
confirm_os_window_close 0
allow_remote_control no

# Open another synthetic view in a split or a new layer.
map ctrl+shift+enter launch --location=split mux-kitty-transport
map ctrl+shift+t launch --type=tab mux-kitty-transport
map ctrl+shift+l next_layout
map ctrl+shift+w close_window
